services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih-isro-client
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - FASTAPI_BASE_URL=${FASTAPI_BASE_URL:-http://localhost:8000}
    env_file:
      - path: .env.local
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
